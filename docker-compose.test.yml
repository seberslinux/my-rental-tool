# Postgres container used by integration tests.
#
# Start:   docker compose -f docker-compose.test.yml up -d
# Stop:    docker compose -f docker-compose.test.yml down -v   (-v wipes the DB)
#
# Tests read `TEST_DATABASE_URL` (falls back to postgres://postgres:postgres@localhost:5433/rental_test).
# Port 5433 is used to avoid clashing with any Postgres already running on 5432.

services:
  test-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rental_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rental_test"]
      interval: 1s
      timeout: 3s
      retries: 15
    tmpfs:
      # Store data in RAM — tests wipe between runs, no need to persist to disk.
      - /var/lib/postgresql/data
