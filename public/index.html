<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rental Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1E293B">
  <style>
    /* ── Dashboard mobile-first cards ── */
    .dash-kpi-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .dash-card {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }
    .dash-card-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-500);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dash-card-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--gray-800);
      line-height: 1.2;
    }
    .dash-card-sub {
      font-size: 13px;
      color: var(--gray-400);
      margin-top: 4px;
    }
    .dash-section {
      margin-bottom: 20px;
    }
    .dash-section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--gray-800);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dash-section-title .count {
      background: var(--gray-100);
      color: var(--gray-600);
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .dash-guest-card {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 8px;
      box-shadow: var(--shadow-sm);
    }
    .dash-guest-card .prop-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 4px;
    }
    .dash-guest-card .guest-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--gray-800);
    }
    .dash-guest-card .guest-dates {
      font-size: 13px;
      color: var(--gray-500);
      margin-top: 4px;
    }
    .dash-guest-card .guest-count {
      font-size: 13px;
      color: var(--gray-400);
      margin-top: 2px;
    }
    .dash-guest-card.vacant {
      background: var(--gray-50);
      border-style: dashed;
    }
    .dash-guest-card.vacant .guest-name {
      color: var(--gray-400);
      font-weight: 500;
    }
    .dash-nextup-card {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 8px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .dash-nextup-card .nextup-left {
      flex: 1;
      min-width: 0;
    }
    .dash-nextup-card .nextup-type {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .dash-nextup-card .nextup-type.checkin {
      color: var(--success);
    }
    .dash-nextup-card .nextup-type.checkout {
      color: var(--danger);
    }
    .dash-nextup-card .nextup-prop {
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-700);
    }
    .dash-nextup-card .nextup-guest {
      font-size: 15px;
      font-weight: 700;
      color: var(--gray-800);
    }
    .dash-nextup-card .nextup-date {
      font-size: 13px;
      color: var(--gray-500);
      margin-top: 2px;
    }
    .dash-nextup-card .nextup-eta {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      white-space: nowrap;
    }
    .dash-alert-card {
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 44px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      border-left: 4px solid transparent;
    }
    .dash-alert-card.urgent {
      background: var(--danger-bg);
      border-left-color: var(--danger);
    }
    .dash-alert-card.warning {
      background: var(--warning-bg);
      border-left-color: var(--warning);
    }
    .dash-alert-card.info {
      background: var(--primary-50);
      border-left-color: var(--primary);
    }
    .dash-alert-card .alert-text {
      font-size: 14px;
      flex: 1;
      line-height: 1.4;
    }
    .dash-alert-card .alert-action {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      white-space: nowrap;
    }
    .dash-job-card {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 8px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .dash-job-card .job-left {
      flex: 1;
      min-width: 0;
    }
    .dash-job-card .job-prop {
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-700);
    }
    .dash-job-card .job-cleaner {
      font-size: 15px;
      font-weight: 500;
      color: var(--gray-800);
      margin-top: 2px;
    }
    .dash-job-card .job-cleaner.unassigned {
      color: var(--danger);
      font-weight: 700;
    }
    .dash-job-card .job-date {
      font-size: 13px;
      color: var(--gray-500);
      margin-top: 2px;
    }
    .dash-job-card .job-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 10px;
    }
    .status-badge.assigned {
      background: var(--success-bg);
      color: #065F46;
    }
    .status-badge.pending, .status-badge.unassigned {
      background: var(--warning-bg);
      color: #B45309;
    }
    .status-badge.completed {
      background: var(--gray-100);
      color: var(--gray-600);
    }
    .dash-empty {
      font-size: 14px;
      color: var(--gray-400);
      padding: 12px 0;
    }
    /* Calendar booking bars */
    .cal-bar {
      height: 14px;
      margin-top: 1px;
      color: #fff;
      font-size: 8px;
      font-weight: 600;
      line-height: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 2px;
      cursor: pointer;
      opacity: 0.85;
    }
    .cal-bar:hover { opacity: 1; }
    @media (min-width: 769px) {
      .cal-bar { height: 18px; line-height: 18px; font-size: 10px; padding: 0 4px; }
    }
    /* Calendar controls mobile stacking */
    .cal-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .cal-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cal-nav h3 {
      min-width: 140px;
      text-align: center;
      margin-bottom: 0;
      font-size: 15px;
    }
    /* Mobile overrides */
    @media (max-width: 768px) {
      .dash-kpi-row {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .dash-card-value {
        font-size: 20px;
      }
      .cal-controls {
        flex-direction: column;
        align-items: stretch;
      }
      .cal-controls select {
        width: 100%;
      }
      .cal-nav {
        justify-content: center;
      }
      .calendar-grid .day .booking-label {
        display: none;
      }
      .calendar-legend {
        flex-wrap: wrap;
        gap: 8px;
      }
    }
    @media (min-width: 769px) {
      .dash-guests-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .dash-guests-grid .dash-guest-card {
        margin-bottom: 0;
      }
      .dash-nextup-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .dash-nextup-grid .dash-nextup-card {
        margin-bottom: 0;
      }
      .dash-jobs-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .dash-jobs-grid .dash-job-card {
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- KPI Cards: Revenue + Pipeline -->
    <div class="dash-kpi-row" id="kpiRow">
      <div class="dash-card"><div class="dash-card-header">Loading...</div></div>
      <div class="dash-card"><div class="dash-card-header">Loading...</div></div>
    </div>

    <!-- Alert Banner (no costs) -->
    <div id="noCostsBanner"></div>

    <!-- Currently Staying -->
    <div class="dash-section" id="currentGuestsSection">
      <div class="dash-section-title">Currently Staying</div>
      <div id="currentGuestsList">
        <div class="dash-empty">Loading...</div>
      </div>
    </div>

    <!-- Next Up -->
    <div class="dash-section" id="nextUpSection">
      <div class="dash-section-title">Next Up</div>
      <div id="nextUpList">
        <div class="dash-empty">Loading...</div>
      </div>
    </div>

    <!-- Needs Attention -->
    <div class="dash-section" id="alertsPanel">
      <div class="dash-section-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Needs Attention
        <span class="count" id="alertsCount">0</span>
      </div>
      <div id="alertsList">
        <div class="dash-empty">Loading...</div>
      </div>
    </div>

    <!-- Cleaning Jobs -->
    <div class="dash-section" id="cleaningJobsSection">
      <div class="dash-section-title">
        Cleaning Jobs (Next 7 Days)
        <span class="count" id="cleaningJobsCount">0</span>
      </div>
      <div id="cleaningJobsList">
        <div class="dash-empty">Loading...</div>
      </div>
    </div>

    <!-- Calendar -->
    <div class="section">
      <div class="section-header">
        <h2>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Calendar
        </h2>
      </div>
      <div class="cal-controls">
        <select id="calendarProperty" onchange="renderCalendar()" style="width:auto;"><option value="all">All Properties</option></select>
        <div class="cal-nav">
          <button class="btn btn-secondary btn-sm" onclick="changeMonth(-1)">&larr;</button>
          <h3 id="calendarMonth"></h3>
          <button class="btn btn-secondary btn-sm" onclick="changeMonth(1)">&rarr;</button>
        </div>
        <select id="jumpMonth" onchange="jumpToMonth()" style="width:auto;font-size:12px;"></select>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div id="calendarLegend" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding:8px 0;"></div>
    </div>

    <!-- Sync (admin only) -->
    <div class="dash-section" id="syncSection" style="margin-top:8px;"></div>

    <!-- Modals -->
    <div class="modal-overlay" id="assignCleanerModal">
      <div class="modal">
        <h2>Assign Cleaner</h2>
        <p id="assignModalInfo"></p>
        <div id="availableCleanersList"></div>
        <button type="button" class="btn btn-secondary" onclick="closeAssignModal()">Cancel</button>
      </div>
    </div>

    <div class="modal-overlay" id="gapDiscountModal">
      <div class="modal" style="max-width:420px;">
        <h2>Gap Discount</h2>
        <p id="gapDiscountInfo" style="margin-bottom:0.8rem;"></p>
        <div style="background:var(--gray-50);border-radius:var(--radius-sm);padding:1rem;margin-bottom:1rem;">
          <div style="display:flex;justify-content:space-between;margin-bottom:0.4rem;"><span>Base price:</span><span id="gapBasePrice"></span></div>
          <div style="display:flex;justify-content:space-between;margin-bottom:0.4rem;"><span>Discount:</span><span id="gapDiscountPct"></span></div>
          <div style="display:flex;justify-content:space-between;font-weight:700;"><span>Discounted price:</span><span id="gapDiscountedPrice" style="color:var(--success);"></span></div>
        </div>
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
          <button class="btn btn-primary" id="gapCopyPromoBtn" onclick="copyGapPromoText()">Copy Promo Text</button>
          <a class="btn btn-secondary" href="https://login.smoobu.com/en/cockpit/calendar" target="_blank" rel="noopener">Open Smoobu</a>
          <button type="button" class="btn btn-secondary" onclick="closeGapDiscountModal()">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
  <script src="shared.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
