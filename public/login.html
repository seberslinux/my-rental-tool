<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Rental Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 2.5rem; width: 100%; max-width: 400px; }
    .login-card h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.5rem; }
    .login-card .subtitle { text-align: center; color: #666; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .login-card label { display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.9rem; }
    .login-card input[type="email"],
    .login-card input[type="password"] { width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; margin-bottom: 1rem; }
    .login-card .btn-login { width: 100%; padding: 0.7rem; font-size: 1rem; }
    .divider { text-align: center; margin: 1.2rem 0; color: #999; font-size: 0.85rem; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #ddd; }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .btn-google { width: 100%; padding: 0.7rem; font-size: 1rem; background: #fff; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: #333; }
    .btn-google:hover { background: #f8f8f8; }
    .error-msg { background: #fee; color: #c00; padding: 0.6rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Rental Manager</h1>
    <p class="subtitle">Sign in to your account</p>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <button type="submit" class="btn btn-primary btn-login">Sign In</button>
    </form>
    <div class="divider">or</div>
    <a href="/api/auth/google" class="btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </a>
  </div>
  <script src="login.js"></script>
</body>
</html>
