<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Rental Manager v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1E293B">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: 1rem; }
    .login-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 2rem; width: 100%; max-width: 400px; }
    .login-card h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.5rem; }
    .login-card .subtitle { text-align: center; color: #666; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .login-card label { display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.9rem; }
    .login-card input[type="email"],
    .login-card input[type="password"],
    .login-card input[type="tel"],
    .login-card input[type="text"] { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; margin-bottom: 1rem; min-height: 48px; -webkit-appearance: none; }
    .login-card input:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .login-card .btn-login { width: 100%; padding: 0.85rem; font-size: 1rem; min-height: 48px; border-radius: 8px; }
    .divider { text-align: center; margin: 1.2rem 0; color: #999; font-size: 0.85rem; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #ddd; }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .btn-google { width: 100%; padding: 0.85rem; font-size: 1rem; background: #fff; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: #333; min-height: 48px; -webkit-tap-highlight-color: transparent; }
    .btn-google:hover { background: #f8f8f8; }
    .btn-google:active { background: #f0f0f0; }
    .error-msg { background: #fee; color: #c00; padding: 0.6rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
    .login-tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 2px solid #e5e7eb; }
    .login-tabs button { flex: 1; padding: 0.75rem; background: none; border: none; font-size: 0.95rem; font-weight: 600; color: #999; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; font-family: inherit; min-height: 44px; -webkit-tap-highlight-color: transparent; }
    .login-tabs button.active { color: #2563eb; border-bottom-color: #2563eb; }
    .login-panel { display: none; }
    .login-panel.active { display: block; }
    .pin-inputs { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1rem; }
    .pin-inputs input { width: 48px; max-width: 56px; height: 56px; text-align: center; font-size: 1.5rem; font-weight: 700; border: 2px solid #ddd; border-radius: 8px; flex-shrink: 1; }
    .pin-inputs input:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    @media (max-width: 360px) {
      .login-card { padding: 1.5rem 1.25rem; }
      .pin-inputs input { width: 44px; height: 52px; font-size: 1.3rem; }
      .pin-inputs { gap: 0.4rem; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Rental Manager</h1>
    <p class="subtitle">Sign in to your account</p>
    <div class="error-msg" id="errorMsg"></div>

    <div class="login-tabs">
      <button class="active" onclick="switchLoginTab('staff')">Staff</button>
      <button onclick="switchLoginTab('cleaner')">Cleaner</button>
    </div>

    <!-- Staff Login -->
    <div class="login-panel active" id="panel-staff">
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <button type="submit" class="btn btn-primary btn-login">Sign In</button>
      </form>
      <div class="divider">or</div>
      <a href="/api/auth/google" class="btn-google" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </a>
    </div>

    <!-- Cleaner Login -->
    <div class="login-panel" id="panel-cleaner">
      <form id="cleanerLoginForm">
        <label for="cleanerPhone">Phone Number</label>
        <input type="tel" id="cleanerPhone" placeholder="+27821234567" required>
        <label>PIN</label>
        <div class="pin-inputs">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="pin-digit" data-idx="0" autofocus>
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="pin-digit" data-idx="1">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="pin-digit" data-idx="2">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="pin-digit" data-idx="3">
        </div>
        <button type="submit" class="btn btn-primary btn-login">Sign In</button>
      </form>
    </div>
  </div>
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
  <script src="login.js"></script>
</body>
</html>
