<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance - Rental Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1E293B">
</head>
<body>
  <div class="container">
    <!-- Status Summary Cards -->
    <div class="status-row" id="statusRow">
      <div class="status-card">
        <div class="status-icon" style="background:var(--danger-bg);color:var(--danger);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div class="status-info"><div class="count" id="openCount">0</div><div class="label">Open</div></div>
      </div>
      <div class="status-card">
        <div class="status-icon" style="background:var(--warning-bg);color:var(--warning);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="status-info"><div class="count" id="progressCount">0</div><div class="label">In Progress</div></div>
      </div>
      <div class="status-card">
        <div class="status-icon" style="background:var(--primary-50);color:var(--primary);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="status-info"><div class="count" id="scheduledCount">0</div><div class="label">Scheduled</div></div>
      </div>
      <div class="status-card">
        <div class="status-icon" style="background:var(--success-bg);color:var(--success);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <div class="status-info"><div class="count" id="completedCount">0</div><div class="label">Completed (90d)</div></div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <div class="filter-group" id="statusFilters">
        <button class="filter-btn active" onclick="filterTickets('all', this)">All</button>
        <button class="filter-btn" onclick="filterTickets('open', this)">Open</button>
        <button class="filter-btn" onclick="filterTickets('in_progress', this)">In Progress</button>
        <button class="filter-btn" onclick="filterTickets('scheduled', this)">Scheduled</button>
        <button class="filter-btn" onclick="filterTickets('resolved', this)">Completed</button>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" type="text" placeholder="Search tickets..." id="ticketSearch" oninput="filterTicketsDebounced()">
      </div>
      <select id="ticketPropertyFilter" onchange="renderTickets()" style="padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--gray-200);font-size:13px;font-family:inherit;background:white;">
        <option value="">All Properties</option>
      </select>
      <button class="btn btn-primary" onclick="toggleNewTicketForm()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Ticket
      </button>
    </div>

    <!-- Ticket Cards -->
    <div class="tickets-grid" id="ticketsGrid">
      <div class="loading">Loading tickets...</div>
    </div>

    <!-- New Ticket Form (hidden by default) -->
    <div class="new-ticket-form" id="newTicketForm" style="display:none;">
      <h3>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create Maintenance Ticket
      </h3>
      <form onsubmit="createTicket(event)">
        <div class="form-grid" style="grid-template-columns:1fr 1fr;">
          <div class="form-field">
            <label>Title</label>
            <input type="text" id="ticketTitle" required placeholder="Brief description of the issue">
          </div>
          <div class="form-field">
            <label>Property</label>
            <select id="ticketProperty" required></select>
          </div>
          <div class="form-field">
            <label>Priority</label>
            <select id="ticketPriority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
          <div class="form-field">
            <label>Category</label>
            <select id="ticketCategory">
              <option>General</option><option>Plumbing</option><option>Electrical</option>
              <option>Appliance</option><option>Furniture</option><option>Cleaning</option>
              <option>Safety</option><option>Pest Control</option><option>Other</option>
            </select>
          </div>
          <div class="form-field full">
            <label>Description</label>
            <textarea id="ticketDescription" placeholder="Describe the issue in detail..."></textarea>
          </div>
          <div class="form-field">
            <label>Estimated Cost (ZAR)</label>
            <input type="number" id="ticketCost" placeholder="0.00">
          </div>
          <div class="form-field">
            <label>Assign To</label>
            <input type="text" id="ticketAssignee" placeholder="Contractor / vendor name">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="toggleNewTicketForm()">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Ticket</button>
        </div>
      </form>
    </div>
  </div>

  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
  <script src="shared.js"></script>
  <script src="maintenance.js"></script>
</body>
</html>
