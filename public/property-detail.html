<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Performance - Rental Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1E293B">
  <style>
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .kpi-card {
      background: white;
      border-radius: var(--radius);
      padding: 1.2rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
      text-align: center;
    }
    .kpi-card .kpi-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--gray-900);
    }
    .kpi-card .kpi-label {
      color: var(--gray-500);
      font-size: 0.85rem;
      margin-top: 0.3rem;
    }
    .prop-header {
      background: white;
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
    }
    .prop-header h1 { margin-bottom: 0.3rem; }
    .prop-meta {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      color: var(--gray-500);
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .prop-meta span { display: flex; align-items: center; gap: 0.3rem; }
    .chart-container {
      background: white;
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
    }
    .chart-container h3 {
      margin-bottom: 1rem;
      color: var(--gray-900);
    }
    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 200px;
      border-bottom: 1px solid var(--gray-200);
      padding-bottom: 4px;
    }
    .bar-chart .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      min-width: 0;
    }
    .bar-chart .bar {
      width: 100%;
      max-width: 50px;
      border-radius: 3px 3px 0 0;
      transition: height 0.3s;
      position: relative;
      cursor: default;
    }
    .bar-chart .bar:hover { opacity: 0.85; }
    .bar-chart .bar-label {
      font-size: 0.65rem;
      color: var(--gray-500);
      margin-top: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .bar-chart .bar-value {
      font-size: 0.6rem;
      color: var(--gray-700);
      margin-bottom: 2px;
      white-space: nowrap;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .data-table th, .data-table td {
      padding: 0.6rem 0.8rem;
      text-align: left;
      border-bottom: 1px solid var(--gray-100);
    }
    .data-table th {
      background: var(--gray-50);
      font-weight: 600;
      color: var(--gray-500);
    }
    .data-table tr:hover { background: var(--gray-50); }
    .review-card {
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      padding: 1rem;
      margin-bottom: 0.8rem;
    }
    .review-card .stars {
      color: var(--warning);
      font-size: 1.1rem;
    }
    .review-card .review-meta {
      font-size: 0.8rem;
      color: var(--gray-400);
      margin-top: 0.3rem;
    }
    .review-card .review-comment {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: var(--gray-700);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 1rem;
      color: var(--primary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
    @media (max-width: 768px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="/properties.html" class="back-link">&larr; Back to Properties</a>

    <div id="propertyHeader" class="prop-header">
      <div class="loading">Loading property...</div>
    </div>

    <div class="kpi-grid" id="kpiGrid"></div>

    <div class="chart-container">
      <h3>Monthly Revenue &amp; Occupancy (Last 12 Months)</h3>
      <div class="bar-chart" id="monthlyChart"></div>
    </div>

    <div class="chart-container">
      <h3>Upcoming Bookings</h3>
      <table class="data-table" id="upcomingTable">
        <thead>
          <tr>
            <th>Guest</th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Nights</th>
            <th>Platform</th>
            <th>Revenue</th>
          </tr>
        </thead>
        <tbody id="upcomingBody"></tbody>
      </table>
    </div>

    <div class="chart-container">
      <h3>Recent Reviews</h3>
      <div id="reviewsList"></div>
    </div>
  </div>

  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
  <script src="shared.js"></script>
  <script src="property-detail.js"></script>
</body>
</html>
