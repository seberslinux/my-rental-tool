<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - Rental Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <div style="display:flex;justify-content:flex-end;margin-bottom:1rem;">
      <button class="btn btn-primary" onclick="showAddForm()">Add User</button>
    </div>

    <div class="card" id="userFormCard" style="display:none;margin-bottom:1.5rem;">
      <h2 id="formTitle">Add User</h2>
      <form id="userForm" onsubmit="saveUser(event)">
        <input type="hidden" id="editUserId">
        <div class="form-row">
          <div class="form-group">
            <label for="userName">Name</label>
            <input type="text" id="userName" required>
          </div>
          <div class="form-group">
            <label for="userEmail">Email</label>
            <input type="email" id="userEmail" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="userRole">Role</label>
            <select id="userRole" onchange="togglePropertyAccess()">
              <option value="admin">Admin</option>
              <option value="property_manager">Property Manager</option>
              <option value="cleaner">Cleaner</option>
            </select>
          </div>
          <div class="form-group">
            <label for="userPassword">Password <small>(leave blank for Google-only)</small></label>
            <input type="password" id="userPassword" minlength="6">
          </div>
        </div>
        <div id="propertyAccessGroup" style="display:none;">
          <label>Property Access</label>
          <div id="propertyCheckboxes" class="checkbox-group"></div>
        </div>
        <div style="margin-top:1rem;display:flex;gap:0.5rem;">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" onclick="hideForm()">Cancel</button>
        </div>
      </form>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Properties</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTable">
          <tr><td colspan="6" class="loading">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="user-management.js"></script>
</body>
</html>
